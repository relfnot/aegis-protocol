name: Aegis Protocol CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Agave
        run: |
          curl -sSfL https://release.anza.xyz/v3.1.12/install -o /tmp/agave-install.sh
          sh /tmp/agave-install.sh
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install tested Anchor CLI
        run: cargo install anchor-cli --version 0.32.1 --locked
      - run: npm ci
      - name: Static checks and Rust boundary tests
        run: |
          cargo fmt --all -- --check
          cargo test --lib --locked
          cargo clippy --all-targets --locked
          npm run test:types
          npm run lint
      - name: Build local program and align deployment key
        run: |
          anchor build
          anchor keys sync
          anchor build
      - name: Create disposable local test wallet
        run: solana-keygen new --no-bip39-passphrase --silent --outfile "$HOME/.config/solana/id.json"
      - name: Transaction security tests and demo scenario
        run: anchor test --skip-build
